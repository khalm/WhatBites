<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#16627a"/>
      <stop offset="0.6" stop-color="#0b3644"/>
      <stop offset="1" stop-color="#061820"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff9f1c"/>
      <stop offset="1" stop-color="#ff5d3a"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8fd3ee" stop-opacity="0.7"/>
    </linearGradient>
    <!-- The bite: scalloped chunk taken out of the lure's back -->
    <mask id="bite">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="352" cy="176" r="34" fill="#000"/>
      <circle cx="388" cy="208" r="34" fill="#000"/>
      <circle cx="402" cy="254" r="32" fill="#000"/>
      <circle cx="440" cy="266" r="44" fill="#000"/>
      <circle cx="420" cy="220" r="26" fill="#000"/>
      <circle cx="420" cy="296" r="22" fill="#000"/>
      <circle cx="372" cy="232" r="30" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- light rays from the surface -->
  <g fill="#ffffff" opacity="0.05">
    <path d="M120 0 L200 0 L120 512 L40 512Z"/>
    <path d="M300 0 L350 0 L330 512 L260 512Z"/>
  </g>

  <!-- fishing line -->
  <path d="M260 0 C262 60 180 110 128 172" stroke="#e8f3f1" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85"/>

  <g transform="rotate(28 256 256)">
    <!-- diving lip -->
    <path d="M96 238 L48 300 L76 316 L128 262Z" fill="url(#lip)" stroke="#bfe7f7" stroke-width="3" stroke-linejoin="round"/>

    <g mask="url(#bite)">
      <!-- body -->
      <path d="M104 236 C130 168 230 148 320 166 C392 180 432 214 440 250 C432 290 392 322 320 334 C230 350 130 320 104 262 Z"
            fill="url(#body)" stroke="#5a2400" stroke-width="6" stroke-linejoin="round"/>
      <!-- belly shine -->
      <path d="M120 262 C160 314 250 330 330 318 C380 310 420 290 432 262 C380 286 250 300 120 262Z" fill="url(#belly)"/>
      <!-- scale stripes -->
      <g stroke="#b5420f" stroke-width="5" stroke-linecap="round" opacity="0.55" fill="none">
        <path d="M232 186 C222 216 222 262 236 300"/>
        <path d="M276 180 C266 214 266 266 280 306"/>
        <path d="M320 182 C310 216 310 266 324 304"/>
      </g>
      <!-- back highlight -->
      <path d="M150 210 C200 180 270 172 330 182" stroke="#fff3c4" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.7"/>
    </g>

    <!-- tooth marks along the bite edge -->
    <g fill="#5a2400">
      <circle cx="326" cy="196" r="5"/>
      <circle cx="356" cy="214" r="5"/>
      <circle cx="350" cy="248" r="5"/>
      <circle cx="372" cy="270" r="5"/>
    </g>

    <!-- eye -->
    <circle cx="156" cy="232" r="24" fill="#ffffff" stroke="#5a2400" stroke-width="5"/>
    <circle cx="150" cy="232" r="12" fill="#0b1f26"/>
    <circle cx="146" cy="227" r="4" fill="#ffffff"/>

    <!-- line tie ring -->
    <circle cx="108" cy="250" r="9" fill="none" stroke="#e8f3f1" stroke-width="5"/>

    <!-- belly treble hook -->
    <g stroke="#dfe7ea" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M232 330 L232 362"/>
      <path d="M232 362 C232 392 200 392 202 370"/>
      <path d="M232 362 C232 392 264 392 262 370"/>
    </g>
    <path d="M196 372 L202 360 L210 372Z" fill="#dfe7ea"/>
    <path d="M256 372 L262 360 L270 372Z" fill="#dfe7ea"/>
  </g>

  <!-- bubbles from the bite -->
  <g fill="none" stroke="#bfe7f7" stroke-width="5" opacity="0.8">
    <circle cx="420" cy="118" r="14"/>
    <circle cx="448" cy="76" r="9"/>
    <circle cx="404" cy="70" r="6"/>
  </g>

  <!-- water surface waves -->
  <path d="M0 450 C60 430 110 470 170 450 S280 430 340 450 S450 470 512 448 V512 H0Z" fill="#0a2a35" opacity="0.9"/>
  <path d="M0 470 C60 452 110 488 170 470 S280 452 340 470 S450 488 512 468" stroke="#2c8aa6" stroke-width="5" fill="none" opacity="0.6"/>
</svg>
